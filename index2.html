<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saksit SAU | Full Stack Developer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

    <!-- Devicon สำหรับ Tech Stack -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

    <!-- Font Awesome สำหรับ Social Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* ===================================
           RESET
        =================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "Inter", sans-serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }


        /* ===================================
           MAIN
        =================================== */

        .container {
            width: 100%;
            min-height: 100vh;
            background: #000;

            max-width: 1080px;
            margin: auto;

            padding: 0 40px 30px;

            border-top: 1px solid #222;
        }


        /* ===================================
           NAVBAR
        =================================== */

        nav {
            height: 115px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logo */

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .logo .terminal {
            color: #00ff9d;
        }

        /* Menu */

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-menu a {
            font-size: 16px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .nav-menu a:hover {
            color: #00ff9d;
        }

        .nav-menu .active {
            color: #ffe500;
        }

        /* Let's talk */

        .talk-btn {
            border: 1px solid #aaa;
            padding: 10px 25px;
            border-radius: 30px;

            transition: 0.3s ease;
        }

        .talk-btn:hover {
            border-color: #fff;
            background: #fff;
            color: #000;
        }


        /* ===================================
           HERO
        =================================== */

        .hero {
            min-height: 450px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            align-items: center;

            padding: 5px 60px 0;
        }


        /* ===================================
           LEFT CONTENT
        =================================== */

        .hero-content {
            padding-top: 15px;
        }

        .hero-title {
            font-family: "Playfair Display", serif;

            font-size: 40px;
            line-height: 1.3;

            max-width: 410px;

            margin-bottom: 10px;
        }

        .hero-description {
            font-size: 16px;
            line-height: 1.35;

            max-width: 400px;

            color: #f2f2f2;

            margin-bottom: 15px;
        }


        /* ===================================
           SOCIAL
        =================================== */

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: #fff;
            color: #000;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;

            transition: 0.3s ease;
        }

        .social-icons a:hover {
            background: #00ff9d;
            transform: translateY(-4px);
        }


        /* ===================================
           PROFILE IMAGE
        =================================== */

        .profile-area {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile {
            width: 410px;
            height: 410px;

            border-radius: 50%;

            overflow: hidden;

            background: #c8874d;
        }

        .profile img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* ===================================
           TECH STACK
        =================================== */

        .tech-section {
            text-align: center;

            margin-top: 15px;
        }

        .tech-title {
            font-size: 16px;
            font-weight: 700;

            margin-bottom: 22px;
        }

        .tech-stack {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 28px;
        }

        .tech {
            width: 38px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.3s ease;
        }

        .tech i {
            font-size: 34px;
        }

        .tech:hover {
            transform: translateY(-7px) scale(1.1);
        }


        /* ===================================
           TECH COLORS
        =================================== */

        .html {
            color: #e34f26;
        }

        .css {
            color: #1572b6;
        }

        .js {
            color: #f7df1e;
        }

        .node {
            color: #68a063;
        }

        .react {
            color: #00d8ff;
        }

        .spring {
            color: #6db33f;
        }

        .java {
            color: #f89820;
        }

        .figma {
            color: #f24e1e;
        }

        .firebase {
            color: #ffca28;
        }


        /* ===================================
           RESPONSIVE - TABLET
        =================================== */

        @media (max-width: 900px) {

            .container {
                padding: 0 30px 40px;
            }

            nav {
                height: 95px;
            }

            .hero {
                padding: 30px 20px 0;

                grid-template-columns: 1fr;

                text-align: center;

                gap: 40px;
            }

            .hero-content {
                order: 2;
            }

            .profile-area {
                order: 1;
            }

            .hero-title,
            .hero-description {
                margin-left: auto;
                margin-right: auto;
            }

            .social-icons {
                justify-content: center;
            }

            .profile {
                width: 330px;
                height: 330px;
            }

            .tech-section {
                margin-top: 50px;
            }
        }


        /* ===================================
           RESPONSIVE - MOBILE
        =================================== */

        @media (max-width: 600px) {

            .container {
                padding: 0 20px 30px;
            }

            nav {
                height: auto;
                padding: 25px 0;

                flex-direction: column;

                gap: 25px;
            }

            .logo {
                font-size: 25px;
            }

            .nav-menu {
                gap: 18px;

                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-menu a {
                font-size: 14px;
            }

            .talk-btn {
                padding: 8px 18px;
            }

            .hero {
                padding: 20px 0 0;
            }

            .profile {
                width: 270px;
                height: 270px;
            }

            .hero-title {
                font-size: 32px;
            }

            .hero-description {
                font-size: 15px;
            }

            .tech-stack {
                gap: 15px;
                flex-wrap: wrap;
            }

            .tech i {
                font-size: 30px;
            }
        }

    </style>
</head>


<body>

    <div class="container">

        <!-- =================================
             NAVIGATION
        ================================== -->

        <nav>

            <!-- Logo -->

            <div class="logo">
                <span class="terminal">&gt;_</span>6619410007 Saksit SAU
            </div>


            <!-- Menu -->

            <div class="nav-menu">

                <a href="#" class="active">
                    Home
                </a>

                <a href="#about">
                    About
                </a>

                <a href="#portfolio">
                    Portfolio
                </a>

                <a href="#contact" class="talk-btn">
                    Let’s talk
                </a>

            </div>

        </nav>



        <!-- =================================
             HERO
        ================================== -->

        <section class="hero" id="about">


            <!-- LEFT -->

            <div class="hero-content">

                <h1 class="hero-title">
                    Full Stack Web
                    <br>
                    Developer !
                </h1>


                <p class="hero-description">
                    Hi, I'm Saksit SAU. A passionate Full Stack
                    Web Developer based in Thailand.
                </p>


                <!-- Social -->

                <div class="social-icons">

                    <a href="#" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                    <a href="#" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>

                </div>

            </div>



            <!-- RIGHT -->

            <div class="profile-area">

                <div class="profile">

                    <!--
                        เปลี่ยน profile.png
                        เป็นรูปโปรไฟล์ของคุณ
                    -->

                    <img
                        src="profile.png"
                        alt="NinniN SAU"
                    >

                </div>

            </div>

        </section>



        <!-- =================================
             TECH STACK
        ================================== -->

        <section class="tech-section" id="portfolio">

            <h2 class="tech-title">
                My Tech Stacks
            </h2>


            <div class="tech-stack">


                <!-- HTML -->

                <div class="tech html" title="HTML5">
                    <i class="devicon-html5-plain"></i>
                </div>


                <!-- CSS -->

                <div class="tech css" title="CSS3">
                    <i class="devicon-css3-plain"></i>
                </div>


                <!-- JavaScript -->

                <div class="tech js" title="JavaScript">
                    <i class="devicon-javascript-plain"></i>
                </div>


                <!-- Node -->

                <div class="tech node" title="Node.js">
                    <i class="devicon-nodejs-plain-wordmark"></i>
                </div>


                <!-- React -->

                <div class="tech react" title="React">
                    <i class="devicon-react-original"></i>
                </div>


                <!-- Spring -->

                <div class="tech spring" title="Spring">
                    <i class="devicon-spring-original"></i>
                </div>


                <!-- Java -->

                <div class="tech java" title="Java">
                    <i class="devicon-java-plain"></i>
                </div>


                <!-- Figma -->

                <div class="tech figma" title="Figma">
                    <i class="devicon-figma-plain"></i>
                </div>


                <!-- Firebase -->

                <div class="tech firebase" title="Firebase">
                    <i class="devicon-firebase-plain"></i>
                </div>

            </div>

        </section>



        <!-- =================================
             CONTACT
        ================================== -->

        <section id="contact"></section>

    </div>


</body>
</html>
